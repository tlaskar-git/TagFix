<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New sweep</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body class="prompt">
  <label>
    Sweep name
    <input id="sweep-name" type="text" spellcheck="false"
      placeholder="round 99 login page">
    <small>Dated and slugged automatically, for example 2026-09-07-round-99</small>
  </label>
  <div id="actions">
    <button id="create-btn">Create</button>
    <span id="status">Enter creates, Esc closes</span>
  </div>
  <script src="newsweep.js"></script>
</body>
</html>
