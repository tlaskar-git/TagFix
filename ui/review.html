<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TagFix review</title>
  <link rel="stylesheet" href="review.css">
</head>
<body>
  <header>
    <h1>Review and export</h1>
    <div id="toolbar">
      <select id="sweep-select"></select>
      <button id="export-btn">Export fix list</button>
      <span id="status"></span>
    </div>
  </header>
  <p id="hint">Drag rows to reorder. Click text to edit. Dropped tags stay in
    the sweep file and can be picked back up.</p>
  <ul id="tag-list"></ul>
  <script src="review.js"></script>
</body>
</html>
