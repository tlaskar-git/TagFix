<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TagFix review</title>
  <link rel="stylesheet" href="review.css">
</head>
<body>
  <header>
    <h1>Review and export</h1>
    <div id="toolbar">
      <select id="sweep-select"></select>
      <button id="new-sweep-btn">New sweep</button>
      <button id="carry-btn">Carry forward</button>
      <button id="export-btn">Export</button>
      <button id="copy-chat-btn">Copy for chat</button>
      <button id="copy-text-btn">Copy as text</button>
      <span class="menu-wrap">
        <button id="open-btn">Open</button>
        <div id="open-menu" class="menu hidden"></div>
      </span>
      <span class="menu-wrap">
        <button id="save-btn">Save as</button>
        <div id="save-menu" class="menu hidden"></div>
      </span>
      <span id="status"></span>
    </div>
  </header>

  <section id="carry-panel" class="hidden">
    <div class="carry-head">
      <span>Carry forward from</span>
      <select id="carry-source"></select>
      <button id="carry-do">Carry</button>
      <button id="carry-close">Close</button>
      <span id="carry-status"></span>
    </div>
    <ul id="carry-list"></ul>
  </section>

  <p id="hint">Drag rows to reorder. Click text to edit. Click a thumbnail to
    enlarge it. Dropped tags stay in the sweep file and can be picked back up.</p>
  <ul id="tag-list"></ul>

  <div id="lightbox" class="hidden"><img id="lightbox-image" alt="enlarged evidence"></div>

  <script src="review.js"></script>
</body>
</html>
